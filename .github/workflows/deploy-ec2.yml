name: Provision and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build --if-present

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init & Apply
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve -var="key_name=${{ secrets.EC2_KEY_NAME }}"

      - name: Get Server IP
        id: ip
        working-directory: ./terraform
        run: echo "ip=$(terraform output -raw ec2_public_ip)" >> "$GITHUB_OUTPUT"

      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem

      - name: Wait for Server
        env:
          HOST: ${{ steps.ip.outputs.ip }}
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=5 ubuntu@$HOST "command -v pm2"; then
              exit 0
            fi
            echo "Server not ready, retrying ($i/30)..."
            sleep 10
          done
          echo "Server never became ready"
          exit 1

      - name: Copy App Files
        env:
          HOST: ${{ steps.ip.outputs.ip }}
        run: |
          ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no ubuntu@$HOST "mkdir -p ~/app"
          scp -i ~/.ssh/key.pem -o StrictHostKeyChecking=no index.js package.json package-lock.json ubuntu@$HOST:~/app/

      - name: Install and Start App
        env:
          HOST: ${{ steps.ip.outputs.ip }}
        run: |
          ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no ubuntu@$HOST "cd ~/app && npm ci --omit=dev && (pm2 restart app || pm2 start index.js --name app)"
          echo "App running at http://$HOST:5000"