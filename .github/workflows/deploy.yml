name: Staging Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: |
          test -f index.html || { echo "Missing index.html"; exit 1; }
          echo test succeeded

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: List the files
        run: ls -la

      - name: Display msg
        run: echo All is well that ends well