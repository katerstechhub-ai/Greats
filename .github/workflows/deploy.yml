name: Staging Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      shared_data: ${{ steps.generate_data.outputs.my_value }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: test -f index.html

      - name: Display msg
        id: generate_data
        run: echo "my_value=hello_from_test" >> $GITHUB_OUTPUT

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Display msg
        run: echo "Output is from step ${{ needs.test.outputs.shared_data }}"